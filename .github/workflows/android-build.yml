name: Android Build

# 触发条件：
# - 手动触发（可选择构建类型与 CPU 架构）
# - push 到 main / trae/agent-* 分支时自动构建 release arm64-v8a APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      architecture:
        description: CPU 架构
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - universal
  push:
    branches:
      - main
      - 'trae/agent-*'

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        # ubuntu-latest 已预装 Android SDK（含近期 platforms/build-tools），
        # 此处仅用于接受 SDK 许可协议，Gradle 缺失组件时会自动下载。
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 安装依赖
        run: npm ci

      - name: 计算 构建参数
        id: args
        run: |
          ARGS="--clean-prebuild"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          ARCH="${{ github.event.inputs.architecture || 'arm64-v8a' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then ARGS="$ARGS --debug"; fi
          if [ "$ARCH" = "universal" ]; then ARGS="$ARGS --universal"; fi
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "构建参数: $ARGS"

      - name: 构建 APK
        env:
          # local-android-build.js 读取 ANDROID_HOME 或 ANDROID_SDK_ROOT；
          # ubuntu-latest 默认 ANDROID_HOME=/usr/local/lib/android/sdk
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: node scripts/local-android-build.js ${{ steps.args.outputs.args }}

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: DayValue-${{ steps.args.outputs.build_type }}-${{ steps.args.outputs.arch }}
          path: DayValue-v*.apk
          if-no-files-found: error
          retention-days: 30
